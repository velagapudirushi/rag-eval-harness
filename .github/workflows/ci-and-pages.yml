name: RAG Eval Harness CI & Benchmark

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install rag-eval-harness package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit & integration test suite
        run: pytest -v

      - name: Run 3-Repo RAG Benchmark & Build Reports
        run: |
          rag-harness export-dataset
          rag-harness benchmark --output-dir benchmarks --docs-html docs/index.html
          cat benchmarks/BENCHMARK_REPORT.md >> $GITHUB_STEP_SUMMARY
