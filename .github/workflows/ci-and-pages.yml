name: RAG Eval Harness CI & GitHub Pages Deploy

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install rag-eval-harness package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit & integration test suite
        run: pytest -v

      - name: Run 3-Repo RAG Benchmark & Build Reports
        run: |
          rag-harness export-dataset
          rag-harness benchmark --output-dir benchmarks --docs-html docs/index.html
          cat benchmarks/BENCHMARK_REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test-and-benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
