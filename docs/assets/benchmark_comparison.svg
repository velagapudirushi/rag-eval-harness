<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="auto">
  <rect width="1100" height="390" rx="16" fill="#0b0f19" stroke="#263354" stroke-width="2"/>

  <text x="40" y="38" fill="#38bdf8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">3-REPO DEMO BENCHMARK RESULTS</text>
  <text x="40" y="64" fill="#f8fafc" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">Retrieval &amp; Dual-Judge Faithfulness Across Public RAG Architectures</text>

  <!-- Legend -->
  <rect x="40" y="84" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="60" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Repo 1: langchain-naive-chroma-rag (34.5ms)</text>

  <rect x="375" y="84" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="395" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Repo 2: llamaindex-hybrid-bm25-rerank (78.2ms)</text>

  <rect x="725" y="84" width="14" height="14" rx="3" fill="#22c55e"/>
  <text x="745" y="96" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Repo 3: langgraph-corrective-self-rag (142.8ms)</text>

  <!-- Grid lines -->
  <line x1="250" y1="125" x2="1040" y2="125" stroke="#1e293b" stroke-width="1"/>
  <line x1="250" y1="345" x2="1040" y2="345" stroke="#334155" stroke-width="1.5"/>
  <line x1="250" y1="120" x2="250" y2="345" stroke="#334155" stroke-width="1.5"/>

  <!-- Metric 1: Overall Pass Rate -->
  <text x="40" y="154" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">Overall Pass Rate</text>
  <rect x="250" y="132" width="350" height="12" rx="4" fill="#ef4444"/>
  <text x="608" y="142" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">46.7% (7/15)</text>
  <rect x="250" y="147" width="600" height="12" rx="4" fill="#38bdf8"/>
  <text x="858" y="157" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">80.0% (12/15)</text>
  <rect x="250" y="162" width="750" height="12" rx="4" fill="#22c55e"/>
  <text x="1008" y="172" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">100.0%</text>

  <!-- Metric 2: Retrieval Recall@5 -->
  <text x="40" y="210" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">Retrieval Recall@5</text>
  <rect x="250" y="188" width="650" height="12" rx="4" fill="#ef4444"/>
  <text x="908" y="198" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">86.7% (MRR 0.82)</text>
  <rect x="250" y="203" width="750" height="12" rx="4" fill="#38bdf8"/>
  <text x="1008" y="213" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">100.0%</text>
  <rect x="250" y="218" width="750" height="12" rx="4" fill="#22c55e"/>
  <text x="1008" y="228" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">100.0%</text>

  <!-- Metric 3: Single LLM Judge Only (Inflated!) -->
  <text x="40" y="266" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">LLM-Judge Only</text>
  <text x="40" y="282" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">(Misses tier/scope swaps)</text>
  <rect x="250" y="244" width="618" height="12" rx="4" fill="#ef4444" opacity="0.75"/>
  <text x="876" y="254" fill="#fca5a5" font-family="monospace" font-size="12">82.4% (Inflated)</text>
  <rect x="250" y="259" width="750" height="12" rx="4" fill="#38bdf8" opacity="0.75"/>
  <text x="1008" y="269" fill="#93c5fd" font-family="monospace" font-size="12">100.0%</text>
  <rect x="250" y="274" width="750" height="12" rx="4" fill="#22c55e" opacity="0.75"/>
  <text x="1008" y="284" fill="#86efac" font-family="monospace" font-size="12">100.0%</text>

  <!-- Metric 4: Cross-Checked Faithfulness (LLM × NLI) -->
  <text x="40" y="322" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Cross-Checked Score</text>
  <text x="40" y="338" fill="#fb7185" font-family="Inter, sans-serif" font-size="11" font-weight="600">(LLM Judge × NLI Entailment)</text>
  <rect x="250" y="300" width="516" height="12" rx="4" fill="#ef4444"/>
  <text x="774" y="310" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">68.9% (4 disagreements)</text>
  <rect x="250" y="315" width="678" height="12" rx="4" fill="#38bdf8"/>
  <text x="936" y="325" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">90.5% (3 caught)</text>
  <rect x="250" y="330" width="733" height="12" rx="4" fill="#22c55e"/>
  <text x="991" y="340" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">97.8% (0 disagreements)</text>
</svg>
