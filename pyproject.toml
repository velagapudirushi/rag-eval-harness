[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-harness"
version = "0.2.0"
description = "Standalone, framework-agnostic RAG evaluation CLI & library with retrieval metrics, dual-engine faithfulness (LLM-Judge cross-checked against NLI Entailment), and representative failure triage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RAG Eval Harness Contributors" }
]
keywords = ["rag", "evaluation", "llm-as-a-judge", "nli", "entailment", "hallucination", "information-retrieval", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
nli = [
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "torch>=2.1.0",
]
llm = [
    "openai>=1.30.0",
    "litellm>=1.40.0",
]
web = [
    "streamlit>=1.35.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
rag-harness = "rag_harness.cli:app"
rageval = "rag_harness.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
